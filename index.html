<!doctype html>
<html><head><meta name=viewport content="width=device-width,initial-scale=1">
<meta name=apple-mobile-web-app-capable content=yes>
<link rel=manifest href=manifest.json>
<title>Tello</title>
<style>
body{margin:0;font-family:-apple-system;background:#0f172a;color:#fff;display:flex;flex-direction:column;height:100vh}
header{padding:12px;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center}
#chat{flex:1;overflow:auto;padding:16px}
.bubble{margin:8px 0;padding:12px 14px;border-radius:14px;max-width:88%;line-height:1.4;white-space:pre-wrap}
.user{background:#1a7a4c;margin-left:auto}
.ai{background:#1e293b}
footer{display:flex;gap:8px;padding:12px;border-top:1px solid #1e293b}
input{flex:1;padding:13px;border-radius:22px;border:none;background:#1e293b;color:#fff;font-size:16px}
button{border:none;background:#1a7a4c;color:#fff;padding:0 20px;border-radius:22px;font-weight:600}
small{opacity:.5}
</style></head><body>
<header><b>Tello • Personal • Sonnet</b><small id=stat>tap to set key</small></header>
<div id=chat><div class="bubble ai">Hey Eli — I'm Tello with attitude like Meta AI. Set your Anthropic key by tapping top right, then ask anything. I can be wrong — check important stuff.</div></div>
<footer><input id=q placeholder="Ask Tello anything..." onkeydown="if(event.key==='Enter')send()"><button onclick=send()>Ask</button></footer>
<script>
let chat=document.getElementById('chat');
function getKey(){return localStorage.getItem('ak')||''}
function setKey(){let k=prompt('Paste sk-ant-... key:'); if(k){localStorage.setItem('ak',k.trim()); document.getElementById('stat').textContent='key saved ✓';}}
document.getElementById('stat').onclick=setKey;
if(!getKey()) setTimeout(setKey,800);
async function send(){
 let input=document.getElementById('q'); let text=input.value.trim(); if(!text) return;
 let key=getKey(); if(!key){setKey(); return;}
 input.value=''; chat.innerHTML+=`<div class="bubble user">${text}</div>`; let id='a'+Date.now(); chat.innerHTML+=`<div class="bubble ai" id="${id}">thinking...</div>`; chat.scrollTop=9e9;
 try{
  let r=await fetch('fetch('https://tello-api.infomomtelo.workers.dev',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,system:"You are Tello - personal Claude Code for Eli, Fresno, title22.app owner. Attitude warm, playful, direct like Meta AI, not corporate. Can do anything. Keep mobile answers short. You know stale worker prod 2026-09-07, showMAR getter.",messages:[{role:'user',content:text}]})});
  let j=await r.json(); if(j.error) throw new Error(j.error.message); let out=j.content?.[0]?.text||'no text'; document.getElementById(id).textContent=out;
 }catch(e){ document.getElementById(id).textContent='Error: '+e.message+'\nIf CORS, we need Worker version.'; }
 chat.scrollTop=9e9;
}
</script></body></html>
